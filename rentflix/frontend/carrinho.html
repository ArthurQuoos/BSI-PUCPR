<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentFlix - Carrinho</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header>
    <h1 onclick="window.location.href='index.html'" style="cursor:pointer">RentFlix</h1>
    <nav>
      <button onclick="window.location.href='index.html'">Voltar</button>
    </nav>
  </header>

  <div class="pagina-carrinho">
    <h2 class="titulo-carrinho">Meu Carrinho</h2>

    <div id="lista-carrinho"></div>

    <div id="carrinho-vazio" style="display:none">
      <p>Seu carrinho está vazio.</p>
      <button class="btn-confirmar" onclick="window.location.href='index.html'">Ver filmes</button>
    </div>

    <div id="resumo-carrinho" style="display:none">
      <div class="resumo-linha">
        <span>Total de filmes:</span>
        <span id="total-filmes">0</span>
      </div>
      <div class="resumo-linha">
        <span>Valor total/dia:</span>
        <span id="total-valor">R$ 0,00</span>
      </div>
      <button class="btn-confirmar" onclick="finalizarAluguel()">Finalizar aluguel</button>
    </div>
  </div>

  <script src="carrinho.js"></script>
</body>
</html>
