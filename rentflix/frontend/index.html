<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentFlix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>RentFlix</h1>
    <nav id="nav-deslogado">
          <button onclick="window.location.href='login.html'">Login</button>
          <button onclick="window.location.href='cadastro.html'">Cadastrar</button>
          <button onclick="window.location.href='carrinho.html'">🛒 <span id="qtd-carrinho">0</span></button>
    </nav>

    <nav id="nav-logado" style="display:none">
          <div class="avatar-container" onclick="document.getElementById('input-avatar').click()">
                <img id="avatar-img" src="https://ui-avatars.com/api/?background=c9a000&color=fff&name=U" alt="Avatar">
               <span class="avatar-edit">✎</span>
               <input type="file" id="input-avatar" accept="image/*" style="display:none">
          </div>
          <span id="nome-usuario" style="font-size:14px; color:#c9a000"></span>
          <button onclick="sair()">Sair</button>
          <button onclick="window.location.href='carrinho.html'">🛒 <span id="qtd-carrinho-logado">0</span></button>
    </nav>
  </header>

  <section id="destaque">
    <div id="destaque-info">
      <h2 id="destaque-titulo"></h2>
      <p id="destaque-preco"></p>
      <button id="destaque-btn" onclick="adicionarCarrinho(0)">Alugar</button>
    </div>
  </section>

  <div class="filtros">
  <button class="btn-filtro ativo" onclick="filtrarGenero(null, this)">Todos</button>
  </div>

  <main>
    <h2 class="secao-titulo">Filmes disponíveis</h2>
    <div id="filmes" class="grid-filmes"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
