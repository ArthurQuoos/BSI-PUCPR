<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentFlix - Administrador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 onclick="window.location.href='index.html'" style="cursor:pointer">RentFlix</h1>
    <nav>
      <span style="font-size:14px; color:#c9a000">Painel do Administrador</span>
      <button onclick="sairAdmin()">Sair</button>
    </nav>
  </header>

  <div class="pagina-admin">
    <div class="menu-admin">
      <button class="btn-menu ativo" onclick="mostrarSecao('usuarios', this)">Usuários</button>
      <button class="btn-menu" onclick="mostrarSecao('filmes', this)">Filmes</button>
      <button class="btn-menu" onclick="mostrarSecao('locacoes', this)">Locações</button>
    </div>

    <div class="conteudo-admin">

      <section id="secao-usuarios">
        <h2 class="titulo-secao">Usuários cadastrados</h2>
        <table class="tabela-admin">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Login</th>
              <th>Tipo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-usuarios"></tbody>
        </table>
      </section>

      <section id="secao-filmes" style="display:none">
        <h2 class="titulo-secao">Filmes cadastrados</h2>
        <div class="form-admin">
          <h3 class="titulo-form">Adicionar novo filme</h3>
          <div class="campos-form">
            <input type="text" id="novo-titulo" placeholder="Título">
            <input type="number" id="novo-ano" placeholder="Ano de lançamento">
            <input type="number" id="novo-preco" placeholder="Preço por dia" step="0.01">
            <input type="text" id="novo-poster" placeholder="Link do poster">
            <select id="novo-genero">
              <option value="">Selecione o gênero</option>
            </select>
            <button class="btn-confirmar" onclick="adicionarFilme()">Adicionar filme</button>
          </div>
          <span id="erro-filme" class="erro"></span>
        </div>
        <table class="tabela-admin">
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Ano</th>
              <th>Preço/dia</th>
              <th>Gênero</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-filmes-admin"></tbody>
        </table>
      </section>

      <section id="secao-locacoes" style="display:none">
        <h2 class="titulo-secao">Locações realizadas</h2>
        <table class="tabela-admin">
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuário</th>
              <th>Filme</th>
              <th>Data início</th>
              <th>Data devolução</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="lista-locacoes"></tbody>
        </table>
      </section>

    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
