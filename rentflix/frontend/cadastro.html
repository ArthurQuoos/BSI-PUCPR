<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentFlix - Cadastro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header>
    <h1 onclick="window.location.href='index.html'" style="cursor:pointer">RentFlix</h1>
    <nav>
      <button onclick="window.location.href='index.html'">Voltar</button>
    </nav>
  </header>

  <div class="pagina-cadastro">
    <div class="form-cadastro">
      <h2>Criar conta</h2>
      <p class="campos-obrigatorios">* Todos os campos são obrigatórios</p>

      <p class="campos-cadastro">Nome Completo</p>
      <input type="text" id="nome" placeholder="Nome completo">

      <p class="campos-cadastro">E-mail</p>
      <input type="email" id="email" placeholder="E-mail">
      
      <p class="campos-cadastro">CPF</p>
      <input type="text" id="cpf" placeholder="CPF (000.000.000-00)" maxlength="14">
      
      <p class="campos-cadastro">Telefone</p>
      <input type="text" id="telefone" placeholder="Telefone ((00) 00000-0000)" maxlength="15">
    
      <p class="campos-cadastro">Login</p>
      <input type="text" id="login" placeholder="Login (mínimo 4 caracteres)">
      
      <p class="campos-cadastro">Senha</p>
      <input type="password" id="senha" placeholder="Senha">
      
      <p class="campos-cadastro">Confime sua senha</p>
      <input type="password" id="confirmar_senha" placeholder="Confirmar senha">
      
      <p class="campos-cadastro">Data de nascimento</p>
      <input type="date" id="data_nascimento" placeholder="DD/MM/AAAA">

      <span id="erro-cadastro" class="erro"></span>

      <button class="btn-confirmar" onclick="cadastrar()">Cadastrar</button>
    </div>
  </div>

  <script src="cadastro.js"></script>
</body>
</html>
