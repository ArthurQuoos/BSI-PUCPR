<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentFlix - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 onclick="window.location.href='index.html'" style="cursor:pointer">RentFlix</h1>
    <nav>
      <button onclick="window.location.href='index.html'">Voltar</button>
    </nav>
  </header>

  <div class="pagina-cadastro">
    <div class="form-cadastro">
      <h2>Criar conta</h2>
      <p class="campos-obrigatorios">* Todos os campos são obrigatórios</p>

      <input type="text" id="nome" placeholder="Nome completo">
      <input type="email" id="email" placeholder="E-mail">
      <input type="text" id="cpf" placeholder="CPF (000.000.000-00)" maxlength="14">
      <input type="text" id="telefone" placeholder="Telefone ((00) 00000-0000)" maxlength="15">
      <input type="text" id="login" placeholder="Login (mínimo 4 caracteres)">
      <input type="password" id="senha" placeholder="Senha">
      <input type="password" id="confirmar_senha" placeholder="Confirmar senha">
      <input type="date" id="data_nascimento">

      <span id="erro-cadastro" class="erro"></span>

      <button class="btn-confirmar" onclick="cadastrar()">Cadastrar</button>
    </div>
  </div>

  <script src="cadastro.js"></script>
</body>
</html>
